[package]
name = "curfew"
version = "0.2.0"
edition = "2021"
description = "Give your household's network a bedtime — throttle everyone except who you exempt."

[[bin]]
name = "curfew"
path = "src/main.rs"

[dependencies]
ctrlc = "3.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
# Real-time packet interception/throttling driver (no built-in Windows
# equivalent of Linux `tc` / macOS `dnctl`).
windivert = { version = "0.7.0-beta.4", features = ["vendored"] }
# Raw Ethernet send/recv for ARP forging (needs Npcap installed on the
# target machine; WinDivert alone can't send non-IP frames).
pnet = "0.35"

[profile.release]
opt-level = 2
